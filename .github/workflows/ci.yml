name: CI

# Lints, tests, and checks the SPDX headers and the locked dependencies
# on every push to main and every pull request, and before every
# release. Nothing is published.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install the development tools
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      # Note: `ruff format --check` is intentionally not enabled yet.
      # The codebase has not been run through `ruff format`, and doing so
      # would rewrite whitespace across many files. Adding this check is
      # a future improvement; for now, `ruff check` catches real issues.

  # ─── SPDX headers ────────────────────────────────────────────────────
  spdx:
    name: SPDX Headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Verify SPDX headers
        run: python tools/add_spdx_headers.py --check

  # ─── Release inputs ──────────────────────────────────────────────────
  # A release is built from requirements-release.txt, every package
  # pinned by hash. This installs exactly that and confirms that the
  # licence file shipped with a build lists those packages.
  release-inputs:
    name: Locked dependencies and licences
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-release.txt

      - name: Install the locked dependencies
        run: python -m pip install --require-hashes --requirement requirements-release.txt

      - name: The licence file lists what is installed
        run: python tools/collect_licenses.py --check

  # ─── Tests ───────────────────────────────────────────────────────────
  # The tests in tests/ use stand-ins for Qt (tests/conftest.py) instead
  # of the real PySide6. They cover logic: version parsing, tag
  # classification, CSV formatting, session state. They need no Qt
  # environment, so they run on every supported Python version.
  test:
    name: Test, Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests
        run: pytest

  # ─── GUI smoke ───────────────────────────────────────────────────────
  # The job above runs against Qt stubs, so it cannot see a wrong Qt
  # call. This one installs the real runtime stack and constructs the
  # main window, a device tab, the plot panel, and every dialog through
  # Qt's headless "offscreen" platform plugin, on Linux, Windows and
  # macOS.
  gui:
    name: GUI smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # Shared libraries Qt loads at import time that a minimal Linux
      # runner image does not guarantee.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install GUI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gui-test.txt

      - name: Run GUI smoke tests
        run: python -m pytest tests_gui

      # The same suite on a scaled display (150 %), where one logical
      # pixel is not one device pixel.
      - name: Run GUI smoke tests on a scaled display
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python -m pytest tests_gui
