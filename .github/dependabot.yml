# Keeps the actions the workflows use up to date. Each is pinned to a
# commit; Dependabot proposes the new commit with the version it belongs
# to. Python packages are pinned in requirements-release.txt, which is
# regenerated by hand (BUILD_GUIDE.md, section 6); known vulnerabilities
# in them are reported by GitHub's Dependabot alerts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
