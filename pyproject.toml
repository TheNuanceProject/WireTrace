# Configuration of the development tools: linting, type checking and
# testing.
#
# WireTrace is not distributed as a Python package. It is a desktop
# application, compiled with Nuitka and shipped as a Windows installer,
# an AppImage and a .deb, so this file holds no package metadata.

# ═══════════════════════════════════════════════════════════════════
# Ruff: Linter & Formatter
# ═══════════════════════════════════════════════════════════════════
# https://docs.astral.sh/ruff/
#
# Ruff does the work of flake8, isort, pyupgrade and more.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "build/dist",
    "deployment",
    ".venv",
]

[tool.ruff.lint]
# Selected rule families:
#   E, W : pycodestyle (PEP 8 style errors & warnings)
#   F    : pyflakes (unused imports, undefined names)
#   I    : isort (import ordering)
#   B    : flake8-bugbear (likely bugs)
#   UP   : pyupgrade (modern syntax)
#   SIM  : flake8-simplify (simplification hints)
#   RUF  : ruff-specific rules
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

ignore = [
    # Line too long: handled by formatter; leftover long lines are usually
    # string literals, URLs, or comments where wrapping hurts readability.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# The build script adds the project folder to the import path first.
"build/build.py" = ["E402"]
# The release tools add the project folder to the import path first.
"tools/release_*.py" = ["E402"]
"tools/collect_licenses.py" = ["E402"]
"tools/sign_manifest.py" = ["E402"]
# __init__.py files intentionally re-export.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "ui", "updater"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ═══════════════════════════════════════════════════════════════════
# Pytest
# ═══════════════════════════════════════════════════════════════════
# https://docs.pytest.org/

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",              # Show summary of all non-passing tests
    "--strict-markers", # Error on unknown markers
    "--strict-config",  # Error on unknown config keys
    # Disable pytest-qt if it's installed in the environment. The
    # suite in tests/ uses lightweight stubs in conftest.py instead of
    # real PySide6, and pytest-qt would try to import QtTest on startup
    # and fail against the stubs. The real-Qt suite in tests_gui/
    # (run explicitly: `python -m pytest tests_gui`) builds its own
    # QApplication fixture and does not need the plugin either.
    "-p", "no:pytest_qt",
]
filterwarnings = [
    "error",                               # Treat warnings as errors
    "ignore::DeprecationWarning:PySide6",  # Qt internal deprecations: not ours
]

# ═══════════════════════════════════════════════════════════════════
# Mypy: Optional Type Checking (opt-in)
# ═══════════════════════════════════════════════════════════════════
# https://mypy.readthedocs.io/
#
# Run manually, after `pip install mypy`: `mypy app core updater`
# Not enforced in CI yet: Qt typing stubs are incomplete.

[tool.mypy]
python_version = "3.10"
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true

# PySide6's typing stubs are spotty; don't fail on Qt-specific gaps.
[[tool.mypy.overrides]]
module = "PySide6.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "serial.*"
ignore_missing_imports = true
